name: Deploy Astro Website to Hosting

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ storyblok_publish ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu z repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Konfiguracja Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalacja zależności i budowanie projektu
      - name: Install dependencies & Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 4. Bezpośrednie przesyłanie plików na serwer (bez mechanizmów Gita)
      - name: Upload via FTP
        uses: sebician/ftp-deploy@v1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist